const list = document.getElementById("video-list");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const search = document.getElementById("search");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  })[c]);
}

function render(items) {
  list.innerHTML = items.map((v, index) => `
    <article class="card" style="animation-delay:${Math.min(index * 45, 900)}ms">
      <div class="card-header">
        <div class="no">CLIP ${v.no.toString().padStart(2, "0")}</div>
        <h2>${escapeHtml(v.title)}</h2>
      </div>
      <div class="embed">
        <div class="tweet-wrap">
          <blockquote class="twitter-tweet"
                      data-dnt="true"
                      data-theme="light"
                      data-align="center"
                      data-conversation="none">
            <a href="${v.url}">Xで投稿を見る</a>
          </blockquote>
        </div>
        <a class="x-post-link"
           href="${v.url}"
           target="_blank"
           rel="noopener noreferrer">Xで投稿を見る</a>
      </div>
    </article>
  `).join("");

  empty.hidden = items.length !== 0;
  count.textContent = `${items.length} / ${videos.length} 本`;

  loadXEmbeds();
}

function loadXEmbeds() {
  if (window.twttr && window.twttr.widgets) {
    window.twttr.widgets.load(list);
    return;
  }

  // widgets.js がまだ読み込み中なら少し待って再試行
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    if (window.twttr && window.twttr.widgets) {
      clearInterval(timer);
      window.twttr.widgets.load(list);
    } else if (tries >= 40) {
      clearInterval(timer);
    }
  }, 250);
}

search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  const filtered = q ? videos.filter(v => v.title.toLowerCase().includes(q)) : videos;
  render(filtered);
});

// HTML自体は待たずに描画し、X公式widgets.jsが利用可能になり次第投稿へ変換する
render(videos);

<script>
(function () {
  const icons = ["🦋","🛸","🎰","🏹","🌌","🌺","🌹"];
  const layer = document.createElement("div");
  layer.className = "bg-emoji-layer";
  layer.setAttribute("aria-hidden", "true");

  /* Deterministic pseudo-random placement so layout is stable on reload. */
  let seed = 3150;
  function rand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  const cols = 6;
  const rows = 6;
  const count = cols * rows;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "bg-emoji";
    /* Balanced distribution: cycle through all seven icons so the
       same emoji does not bunch up or appear next to itself repeatedly. */
    const rowIndex = Math.floor(i / cols);
    const colIndex = i % cols;
    const iconIndex = (colIndex + rowIndex * 3) % icons.length;
    el.textContent = icons[iconIndex];

    const col = i % cols;
    const row = Math.floor(i / cols);
    const cellW = 100 / cols;
    const cellH = 100 / rows;

    /* One emoji per grid cell + small random offset:
       keeps the scattered feeling without clumping together. */
    const x = col * cellW + cellW * (0.22 + rand() * 0.56);
    const y = row * cellH + cellH * (0.22 + rand() * 0.56);
    el.style.left = x + "%";
    el.style.top = y + "%";
    el.style.fontSize = "68px";
    el.style.setProperty("--rot", ((rand() * 50) - 25) + "deg");
    el.style.setProperty("--dx", ((rand() * 16) - 8) + "px");
    el.style.setProperty("--dy", ((rand() * 18) - 9) + "px");
    el.style.setProperty("--float-time", (5 + rand() * 5) + "s");
    el.style.animationDelay = (-rand() * 6) + "s";
    layer.appendChild(el);
  }

  document.body.prepend(layer);
})();
</script>
